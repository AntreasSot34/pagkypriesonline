{

<div class="tbox"><h4>Μονοτονία</h4>
<p>Μια συνάρτηση $f$ λέγεται <b>γνησίως αύξουσα</b> σε ένα διάστημα $\Delta$ αν για οποιαδήποτε $x_1, x_2 \in \Delta$:</p>
$$x_1 < x_2 \;\Rightarrow\; f(x_1) < f(x_2)$$
<p>Δηλαδή όσο μεγαλώνει το $x$, μεγαλώνει και το $f(x)$ — η γραφική παράσταση «ανεβαίνει» από αριστερά προς τα δεξιά.</p>
<p><b>Γνησίως φθίνουσα</b>: $x_1 < x_2 \Rightarrow f(x_1) > f(x_2)$ (η γραφική «κατεβαίνει»). <b>Σταθερή</b>: $f(x_1) = f(x_2)$ για όλα τα $x_1, x_2$.</p></div>

<div class="tbox"><h4>Ακρότατα</h4>
<p><b>Ολικό μέγιστο</b> στο $x_0$: $f(x) \le f(x_0)$ για <u>κάθε</u> $x$ του πεδίου ορισμού. <b>Ολικό ελάχιστο</b>: $f(x) \ge f(x_0)$ για κάθε $x$.</p>
<p><b>Τοπικό μέγιστο / ελάχιστο</b>: η ίδια ανισότητα ισχύει μόνο «κοντά» στο $x_0$ (σε ένα μικρό διάστημα γύρω του).</p>
<p>Κάθε ολικό ακρότατο είναι και τοπικό — το αντίστροφο δεν ισχύει. Μάλιστα ένα τοπικό μέγιστο μπορεί να είναι <b>μικρότερο</b> από ένα τοπικό ελάχιστο!</p></div>

<div class="tbox tip"><h4>Κόλπο χωρίς παραγώγους</h4>
<p>Για τετραγωνική συνάρτηση, συμπλήρωσε τετράγωνο:</p>
$$f(x) = x^2 - 4x + 7 = (x-2)^2 + 3 \ge 3$$
<p>Αφού $(x-2)^2 \ge 0$, η $f$ έχει <b>ολικό ελάχιστο</b> $f(2) = 3$.</p></div>

<div class="tbox warn"><h4>Σε κλειστό διάστημα $[\alpha, \beta]$</h4>

{
  id: "1.2", unit: 1, title: "Μονοτονία – Ακρότατα (Θεωρήματα)",
  book: "Α΄ Τεύχος §1.2 · Δραστηριότητες σελ. 36",
  theory: R`
<div class="tbox"><h4>Μονοτονία με την παράγωγο</h4>
<p>Αν σε ένα διάστημα $\Delta$ ισχύει:</p>
<ul><li>$f'(x) > 0$ για κάθε εσωτερικό $x$ ⇒ η $f$ είναι <b>γνησίως αύξουσα</b> στο $\Delta$</li>
<li>$f'(x) < 0$ ⇒ <b>γνησίως φθίνουσα</b></li>
<li>$f'(x) = 0$ για κάθε $x$ ⇒ <b>σταθερή</b></li></ul></div>

<div class="tbox"><h4>Κρίσιμα σημεία & Θεώρημα Fermat</h4>
<p>Αν η $f$ έχει τοπικό ακρότατο σε εσωτερικό σημείο $x_0$ και είναι παραγωγίσιμη εκεί, τότε $f'(x_0) = 0$.</p>
<p>Οι ρίζες της $f'$ λέγονται <b>κρίσιμα σημεία</b>: είναι οι <i>υποψήφιες</i> θέσεις ακροτάτων.</p></div>

<div class="tbox warn"><h4>⚠ Το αντίστροφο ΔΕΝ ισχύει</h4>
<p>$f(x) = x^3$: $f'(0) = 0$, αλλά $f'(x) = 3x^2 \ge 0$ και από τις δύο μεριές, άρα η $f$ είναι γνησίως αύξουσα και το $0$ <b>δεν</b> είναι θέση ακροτάτου.</p></div>

<div class="tbox tip"><h4>Μέθοδος (κριτήριο πρώτης παραγώγου)</h4>
<ol><li>Βρίσκω $f'(x)$ και λύνω $f'(x) = 0$.</li>
<li>Φτιάχνω πίνακα προσήμων της $f'$.</li>
<li>$+ \to -$: <b>τοπικό μέγιστο</b> · $- \to +$: <b>τοπικό ελάχιστο</b> · χωρίς αλλαγή: όχι ακρότατο.</li>
<li>Σε κλειστό $[\alpha,\beta]$: συγκρίνω τις τιμές στα κρίσιμα σημεία <b>και</b> στα άκρα.</li></ol></div>`,
  widget: "deriv",
  gen: "g12",
  exercises: [
    { level: 1, type: "fields", q: R`Να βρείτε το κρίσιμο σημείο και το ακρότατο της $f(x) = x^2 - 6x + 1$.`,
      fields: [{ label: "κρίσιμο σημείο x =", ans: 3 }, { label: "τιμή ακροτάτου =", ans: -8 }],
      hint: R`$f'(x) = 2x - 6$.`,
      sol: R`$f'(x) = 2x - 6 = 0 \Leftrightarrow x = 3$. Για $x<3$: $f'<0$, για $x>3$: $f'>0$ ⇒ ελάχιστο $f(3) = 9 - 18 + 1 = -8$.` },
    { level: 1, type: "fields", q: R`Να βρείτε τα τοπικά ακρότατα της $f(x) = x^3 - 12x$.`,
      fields: [{ label: "τοπ. μέγιστο στο x =", ans: -2 }, { label: "τιμή =", ans: 16 }, { label: "τοπ. ελάχιστο στο x =", ans: 2 }, { label: "τιμή =", ans: -16 }],
      hint: R`$f'(x) = 3x^2 - 12 = 3(x-2)(x+2)$. Πρόσημα: $+,\,-,\,+$.`,
      sol: R`$f'(x) = 3(x-2)(x+2)$, ρίζες $\pm 2$. Πρόσημο $f'$: $+$ στο $(-\infty,-2)$, $-$ στο $(-2,2)$, $+$ στο $(2,\infty)$.<br>Τοπικό μέγιστο $f(-2) = -8 + 24 = 16$, τοπικό ελάχιστο $f(2) = 8 - 24 = -16$.` },
    { level: 2, type: "fields", q: R`Να βρείτε τα τοπικά ακρότατα της $f(x) = -2x^3 + 3x^2 + 12x - 4$.`,
      fields: [{ label: "τοπ. ελάχιστο στο x =", ans: -1 }, { label: "τιμή =", ans: -11 }, { label: "τοπ. μέγιστο στο x =", ans: 2 }, { label: "τιμή =", ans: 16 }],
      hint: R`$f'(x) = -6x^2 + 6x + 12 = -6(x-2)(x+1)$. Προσοχή: αρνητικός συντελεστής ⇒ πρόσημα $-,\,+,\,-$.`,
      sol: R`$f'(x) = -6(x^2 - x - 2) = -6(x-2)(x+1)$. Πρόσημα: $-$ στο $(-\infty,-1)$, $+$ στο $(-1,2)$, $-$ στο $(2,\infty)$.<br>Τοπικό ελάχιστο $f(-1) = 2 + 3 - 12 - 4 = -11$, τοπικό μέγιστο $f(2) = -16 + 12 + 24 - 4 = 16$.` },
    { level: 2, type: "mc", q: R`Για τη συνάρτηση $f(x) = x^3 + 3x$ ισχύει:`,
      options: ["Έχει τοπικό μέγιστο στο 0", "Έχει δύο τοπικά ακρότατα", "Είναι γνησίως αύξουσα στο ℝ και δεν έχει ακρότατα", "Είναι γνησίως φθίνουσα στο ℝ"], correct: 2,
      hint: R`Μπορεί ποτέ το $3x^2 + 3$ να γίνει $0$;`,
      sol: R`$f'(x) = 3x^2 + 3 > 0$ για κάθε $x$ (άθροισμα μη αρνητικού και θετικού). Άρα η $f$ είναι <b>γνησίως αύξουσα στο ℝ</b> και, αφού η $f'$ δεν μηδενίζεται, δεν έχει ακρότατα.` },
    { level: 2, type: "fields", q: R`Να βρείτε τα ολικά ακρότατα της $f(x) = x^3 - 3x$ στο διάστημα $[0, 2]$.`,
      fields: [{ label: "ολικό ελάχιστο =", ans: -2 }, { label: "ολικό μέγιστο =", ans: 2 }],
      hint: R`Κρίσιμα σημεία: $x = \pm 1$ — κράτα μόνο όσα ανήκουν στο $[0,2]$. Σύγκρινε με τα άκρα.`,
      sol: R`$f'(x) = 3x^2 - 3 = 0 \Leftrightarrow x = \pm 1$. Μέσα στο $[0,2]$ μόνο το $x = 1$.<br>Τιμές: $f(0) = 0$, $f(1) = -2$, $f(2) = 8 - 6 = 2$.<br>Ολικό ελάχιστο <b>$-2$</b> (στο $x=1$), ολικό μέγιστο <b>$2$</b> (στο $x=2$, δηλαδή σε άκρο!).` },
    { level: 3, type: "fields", q: R`Η $f(x) = x^3 + \alpha x^2 + \beta x + 1$ έχει τοπικά ακρότατα στα $x = 1$ και $x = 3$. Να βρείτε τα $\alpha, \beta$.`,
      fields: [{ label: "α =", ans: -6 }, { label: "β =", ans: 9 }],
      hint: R`Η $f'(x) = 3x^2 + 2\alpha x + \beta$ έχει ρίζες $1$ και $3$, άρα $f'(x) = 3(x-1)(x-3)$.`,
      sol: R`Αφού $f'(1) = f'(3) = 0$ και ο μεγιστοβάθμιος συντελεστής της $f'$ είναι $3$: $f'(x) = 3(x-1)(x-3) = 3x^2 - 12x + 9$.<br>Συγκρίνοντας με $3x^2 + 2\alpha x + \beta$: $2\alpha = -12 \Rightarrow \alpha = -6$ και $\beta = 9$. (Οι ρίζες είναι απλές, άρα η $f'$ αλλάζει πρόσημο ⇒ είναι πράγματι ακρότατα.)` },
    { level: 3, type: "mc", q: R`Για $f(x) = x^3 - kx^2 + 3x$ βρίσκουμε ότι $f'(1) = 0$ όταν $k = 3$. Τότε το $x = 1$ είναι:`,
      options: ["θέση τοπικού μεγίστου", "θέση τοπικού ελαχίστου", "όχι θέση ακροτάτου"], correct: 2,
      hint: R`Για $k = 3$: $f'(x) = 3x^2 - 6x + 3$. Παραγοντοποίησέ την.`,
      sol: R`$f'(x) = 3(x^2 - 2x + 1) = 3(x-1)^2 \ge 0$. Η $f'$ <b>δεν αλλάζει πρόσημο</b> στο 1, άρα η $f$ είναι γνησίως αύξουσα και το $x=1$ <b>δεν</b> είναι θέση ακροτάτου. Παγίδα: το $f'(x_0)=0$ δεν αρκεί!` }
  ]
},

/* ───────────────────────────── 1.3 ───────────────────────────── */
{
  id: "1.3", unit: 1, title: "Κυρτότητα – Σημεία καμπής",
  book: "Α΄ Τεύχος §1.3 · Δραστηριότητες σελ. 44",
  theory: R`
<div class="tbox"><h4>Κυρτή – Κοίλη</h4>
<p>Η $f$ είναι <b>κυρτή</b> (ή <b>στρέφει τα κοίλα άνω</b>, σχήμα $\cup$) σε ένα διάστημα αν η $f'$ είναι γνησίως αύξουσα εκεί — οι κλίσεις των εφαπτομένων μεγαλώνουν.</p>
<p>Η $f$ είναι <b>κοίλη</b> (ή <b>στρέφει τα κοίλα κάτω</b>, σχήμα $\cap$) αν η $f'$ είναι γνησίως φθίνουσα.</p>
<p>Γεωμετρικά: κυρτή ⇒ η γραφική βρίσκεται <b>πάνω</b> από τις εφαπτομένες της· κοίλη ⇒ <b>κάτω</b>.</p></div>

<div class="tbox"><h4>Κριτήριο δεύτερης παραγώγου</h4>
<ul><li>$f''(x) > 0$ στο διάστημα ⇒ <b>κυρτή</b> ($\cup$)</li>
<li>$f''(x) < 0$ στο διάστημα ⇒ <b>κοίλη</b> ($\cap$)</li></ul></div>

<div class="tbox"><h4>Σημείο καμπής</h4>
<p>Το σημείο $(x_0, f(x_0))$ είναι <b>σημείο καμπής</b> αν η $f$ <b>αλλάζει κυρτότητα</b> εκατέρωθεν του $x_0$. Για πολυωνυμική συνάρτηση τότε $f''(x_0) = 0$.</p></div>

<div class="tbox warn"><h4>⚠ Ούτε εδώ αρκεί το $f''(x_0)=0$</h4>
<p>$f(x) = x^4$: $f''(x) = 12x^2$, $f''(0) = 0$, αλλά $f'' \ge 0$ και από τις δύο μεριές ⇒ κυρτή παντού, το $(0,0)$ <b>δεν</b> είναι σημείο καμπής.</p></div>`,
  widget: "convex",
  exercises: [
    { level: 1, type: "fields", q: R`Να βρείτε το σημείο καμπής της $f(x) = x^3 - 3x^2 + 2$.`,
      fields: [{ label: "x₀ =", ans: 1 }, { label: "f(x₀) =", ans: 0 }],
      hint: R`$f''(x) = 6x - 6$.`,
      sol: R`$f'(x) = 3x^2 - 6x$, $f''(x) = 6x - 6 = 0 \Leftrightarrow x = 1$. Για $x<1$: $f''<0$ (κοίλη), για $x>1$: $f''>0$ (κυρτή). Αλλάζει κυρτότητα ⇒ σημείο καμπής <b>$(1, 0)$</b>, αφού $f(1) = 1 - 3 + 2 = 0$.` },
    { level: 1, type: "mc", q: R`Η $f(x) = -x^3 + 6x^2$ είναι <b>κυρτή</b> στο διάστημα:`,
      options: ["$(-\\infty, 2]$", "$[2, +\\infty)$", "$(-\\infty, 0]$", "σε όλο το ℝ"], correct: 0,
      hint: R`$f''(x) = -6x + 12$. Πότε είναι θετική;`,
      sol: R`$f''(x) = -6x + 12 > 0 \Leftrightarrow x < 2$. Άρα κυρτή στο $(-\infty, 2]$ και κοίλη στο $[2, +\infty)$. Σημείο καμπής $(2, f(2)) = (2, 16)$.` },
    { level: 2, type: "fields", q: R`Να βρείτε τα σημεία καμπής της $f(x) = x^4 - 24x^2 + 5$.`,
      fields: [{ label: "θετική τετμημένη x₀ =", ans: 2 }, { label: "f(x₀) =", ans: -75 }],
      hint: R`$f''(x) = 12x^2 - 48 = 12(x-2)(x+2)$. Λόγω συμμετρίας τα σημεία έχουν την ίδια τεταγμένη.`,
      sol: R`$f''(x) = 12(x^2 - 4)$, ρίζες $\pm 2$, πρόσημα $+,\,-,\,+$ ⇒ αλλάζει κυρτότητα και στα δύο.<br>$f(\pm 2) = 16 - 96 + 5 = -75$. Σημεία καμπής <b>$(-2, -75)$</b> και <b>$(2, -75)$</b>.` },
    { level: 2, type: "fields", q: R`Να βρείτε τα σημεία καμπής της $f(x) = x^4 - 4x^3$. Δώστε το σημείο με τη <b>μεγαλύτερη</b> τετμημένη.`,
      fields: [{ label: "x₀ =", ans: 2 }, { label: "f(x₀) =", ans: -16 }],
      hint: R`$f''(x) = 12x^2 - 24x = 12x(x-2)$.`,
      sol: R`$f''(x) = 12x(x-2)$: πρόσημα $+,\,-,\,+$ ⇒ σημεία καμπής στα $x = 0$ και $x = 2$.<br>$f(0) = 0$, $f(2) = 16 - 32 = -16$. Σημεία καμπής $(0,0)$ και <b>$(2,-16)$</b>.` },
    { level: 2, type: "mc", q: R`Για τη $f(x) = x^4$, το σημείο $(0, 0)$:`,
      options: ["είναι σημείο καμπής, γιατί $f''(0) = 0$", "δεν είναι σημείο καμπής", "είναι τοπικό μέγιστο"], correct: 1,
      hint: R`Κοίτα το πρόσημο της $f'' = 12x^2$ αριστερά και δεξιά του 0.`,
      sol: R`$f''(x) = 12x^2 \ge 0$ και από τις δύο μεριές ⇒ η $f$ είναι κυρτή παντού, <b>δεν</b> αλλάζει κυρτότητα. Άρα το $(0,0)$ δεν είναι σημείο καμπής (είναι μάλιστα ολικό ελάχιστο).` },
    { level: 3, type: "fields", q: R`Η $f(x) = x^3 + \alpha x^2 + \beta x$ έχει σημείο καμπής το $(1, -1)$. Να βρείτε τα $\alpha, \beta$.`,
      fields: [{ label: "α =", ans: -3 }, { label: "β =", ans: 1 }],
      hint: R`Δύο συνθήκες: $f''(1) = 0$ και $f(1) = -1$.`,
      sol: R`$f''(x) = 6x + 2\alpha$, $f''(1) = 0 \Rightarrow 6 + 2\alpha = 0 \Rightarrow \alpha = -3$.<br>$f(1) = -1 \Rightarrow 1 - 3 + \beta = -1 \Rightarrow \beta = 1$. (Η $f'' = 6x - 6$ αλλάζει πρόσημο στο 1 ✓.)` }
  ]
},

/* ───────────────────────────── 1.4 ───────────────────────────── */
{
  id: "1.4", unit: 1, title: "Μελέτη συνάρτησης – Γραφική παράσταση",
  book: "Α΄ Τεύχος §1.4 · Δραστηριότητες σελ. 47",
  theory: R`
<div class="tbox"><h4>Τα βήματα της μελέτης</h4>
<ol><li><b>Πεδίο ορισμού</b> (πολυώνυμο: $\mathbb{R}$) και <b>τομές με τους άξονες</b>: $x = 0$ δίνει την τομή με τον άξονα $y$· $f(x) = 0$ τις τομές με τον άξονα $x$.</li>
<li><b>$f'$</b> → διαστήματα μονοτονίας και τοπικά ακρότατα.</li>
<li><b>$f''$</b> → κυρτότητα και σημεία καμπής.</li>
<li><b>Συμπεριφορά στα άκρα</b>: οριακές τιμές για $x \to \pm\infty$.</li>
<li><b>Συγκεντρωτικός πίνακας</b> και σχεδίαση.</li></ol></div>

<div class="tbox tip"><h4>Όρια στο $\pm\infty$ — μόνο ο μεγιστοβάθμιος όρος μετράει</h4>
$$\lim_{x\to\pm\infty}(\alpha_\nu x^\nu + \dots + \alpha_0) = \lim_{x\to\pm\infty} \alpha_\nu x^\nu$$
<p>Π.χ. $\lim_{x\to -\infty}(-2x^3 + x) = \lim_{x\to-\infty}(-2x^3) = +\infty$.</p></div>

<div class="tbox"><h4>Παράδειγμα πίνακα: $f(x) = x^3 - 3x + 2$</h4>
<div class="tblwrap"><table class="vt"><tr><th>$x$</th><td>$-\infty$</td><td>$-1$</td><td></td><td>$0$</td><td></td><td>$1$</td><td>$+\infty$</td></tr>
<tr><th>$f'$</th><td></td><td>$+\;\;0$</td><td>$-$</td><td>$-$</td><td>$-$</td><td>$0\;\;+$</td><td></td></tr>
<tr><th>$f''$</th><td></td><td>$-$</td><td>$-$</td><td>$0$</td><td>$+$</td><td>$+$</td><td></td></tr>
<tr><th>$f$</th><td>$-\infty$</td><td>μέγ. $4$</td><td>↘</td><td>καμπή $2$</td><td>↘</td><td>ελάχ. $0$</td><td>$+\infty$</td></tr></table></div>
<p>Δοκίμασε τη γεννήτρια πιο κάτω: κάθε φορά νέα συνάρτηση για πλήρη μελέτη!</p></div>`,
  widget: null,
  gen: "g14",
  exercises: [
    { level: 1, type: "mc", q: R`Πόσο είναι το $\displaystyle\lim_{x\to -\infty}(-2x^3 + x)$;`,
      options: ["$-\\infty$", "$+\\infty$", "$0$", "$-2$"], correct: 1,
      hint: R`Κράτα μόνο το $-2x^3$. Τι πρόσημο έχει το $x^3$ όταν $x \to -\infty$;`,
      sol: R`$\lim_{x\to-\infty}(-2x^3) $: το $x^3 \to -\infty$ και πολλαπλασιάζεται με $-2$ ⇒ <b>$+\infty$</b>.` },
    { level: 2, type: "fields", q: R`Μελέτη της $f(x) = x^3 - 3x^2$. Συμπληρώστε:`,

      hint: R`$f'(x) = -3x^2 + 3 = -3(x-1)(x+1)$: πρόσημα $-,+,-$. Παραγοντοποίηση: $f(x) = -(x-2)(x+1)^2$.`,
      sol: R`$f(0) = 2$. $f'(x) = -3(x-1)(x+1)$: $-,+,-$ ⇒ τοπ. ελάχιστο $f(-1) = 1 - 3 + 2 = 0$, τοπ. μέγιστο $f(1) = -1 + 3 + 2 = 4$.<br>$f''(x) = -6x$ ⇒ καμπή $(0, 2)$. Τομές με $x$: $f(x) = -(x-2)(x+1)^2$ ⇒ $x = 2$ και $x = -1$ (εφάπτεται).<br>$\lim_{x\to-\infty}(-x^3) = +\infty$, $\lim_{x\to+\infty}(-x^3) = -\infty$.`, graph: "-x^3+3x+2" },
    { level: 3, type: "fields", q: R`Μελέτη της $f(x) = x^4 - 2x^2 + 1$. Να βρείτε το τοπικό μέγιστο και την τεταγμένη των σημείων καμπής.`,

      hint: R`$f(x) = (x^2-1)^2$, $f'(x) = 4x(x-1)(x+1)$, $f''(x) = 12x^2 - 4$. Μπορείς να γράψεις $\sqrt{3}/3$ ως <code>√3/3</code> ή <code>sqrt(3)/3</code>.`,

/* ───────────────────────────── 2.2 ───────────────────────────── */
{
  id: "2.1–2.2", unit: 2, title: "Ορισμός αόριστου ολοκληρώματος",
  book: "Α΄ Τεύχος §2.1–2.2 · Δραστηριότητες σελ. 67",
  theory: R`
<div class="tbox"><h4>Η «ανάποδη» της παραγώγισης</h4>
<p>Μια συνάρτηση $F$ λέγεται <b>αντιπαράγωγος</b> της $f$ σε ένα διάστημα αν $F'(x) = f(x)$ για κάθε $x$ του διαστήματος.</p>
<p>Π.χ. η $F(x) = x^2$ είναι αντιπαράγωγος της $f(x) = 2x$, γιατί $(x^2)' = 2x$. Το ίδιο όμως ισχύει και για τις $x^2 + 5$, $x^2 - 7$, ...</p></div>

<div class="tbox"><h4>Αόριστο ολοκλήρωμα</h4>
<p>Αν $F$ είναι μια αντιπαράγωγος της $f$, τότε <b>όλες</b> οι αντιπαράγωγοι είναι οι $F(x) + c$, $c \in \mathbb{R}$. Γράφουμε:</p>
$$\int f(x)\,dx = F(x) + c$$
<p>Το $c$ λέγεται <b>σταθερά ολοκλήρωσης</b>. Γεωμετρικά: μια <b>οικογένεια καμπυλών</b>, μετατοπισμένων κατακόρυφα η μία από την άλλη.</p></div>

<div class="tbox tip"><h4>Πάντα μπορείς να ελέγξεις!</h4>
<p>Παραγώγισε το αποτέλεσμά σου: αν βγει η αρχική συνάρτηση, είναι σωστό. Έτσι ελέγχει και η σελίδα τις απαντήσεις σου.</p></div>`,
  widget: "family",
  exercises: [
    { level: 1, type: "mc", q: R`Ποια συνάρτηση είναι αντιπαράγωγος της $f(x) = 2x$;`,
      options: ["$F(x) = 2$", "$F(x) = x^2 + 5$", "$F(x) = 2x^2$", "$F(x) = x^2 + 2x$"], correct: 1,
      hint: R`Παραγώγισε κάθε επιλογή.`,
      sol: R`$(x^2 + 5)' = 2x$ ✓. Οι άλλες δίνουν $0$, $4x$ και $2x + 2$.` },
    { level: 1, type: "anti", f: "3x^2", q: R`Να βρείτε το $\displaystyle\int 3x^2\,dx$. <span class="muted">(Μπορείς να γράψεις και το $+c$ ή να το παραλείψεις.)</span>`,
      hint: R`Ποια συνάρτηση έχει παράγωγο $3x^2$;`,
      sol: R`$(x^3)' = 3x^2$, άρα $\int 3x^2\,dx = x^3 + c$.` },
    { level: 1, type: "fields", q: R`Οι αντιπαράγωγοι της $f(x) = 3x^2$ είναι $F(x) = x^3 + c$. Να βρείτε το $c$ ώστε η γραφική της $F$ να διέρχεται από το $(1, 4)$.`,
      fields: [{ label: "c =", ans: 3 }],
      hint: R`$F(1) = 4$.`,
      sol: R`$F(1) = 1 + c = 4 \Rightarrow c = 3$, άρα $F(x) = x^3 + 3$.` },
    { level: 2, type: "mc", q: R`Αν $F$ και $G$ είναι δύο αντιπαράγωγοι της ίδιας συνάρτησης $f$ σε ένα διάστημα, τότε:`,
      options: ["$F = G$ οπωσδήποτε", "$F - G$ είναι σταθερή συνάρτηση", "$F + G = f$", "$F \\cdot G = c$"], correct: 1,
      hint: R`Παραγώγισε τη $F - G$.`,
      sol: R`$(F - G)' = F' - G' = f - f = 0$, άρα η $F - G$ είναι σταθερή: $F(x) = G(x) + c$.` },
    { level: 2, type: "expr", ref: "6x^2-2", q: R`Αν $\displaystyle\int f(x)\,dx = 2x^3 - 2x + c$, να βρείτε την $f(x)$.`,
      hint: R`Η $f$ είναι η <b>παράγωγος</b> του αποτελέσματος.`,
      sol: R`$f(x) = (2x^3 - 2x + c)' = 6x^2 - 2$.` }
  ]
},

/* ───────────────────────────── 2.3 ───────────────────────────── */
{
  id: "2.3", unit: 2, title: "Κανόνες ολοκλήρωσης",
  book: "Α΄ Τεύχος §2.3 · Δραστηριότητες σελ. 72",
  theory: R`
<div class="tbox"><h4>Βασικά ολοκληρώματα</h4>
$$\int k\,dx = kx + c \qquad \int x^{a}\,dx = \frac{x^{a+1}}{a+1} + c,\;\; a \ne -1$$
<p>Ο κανόνας της δύναμης: <b>ανεβάζω τον εκθέτη κατά 1 και διαιρώ με τον νέο εκθέτη</b>. Ισχύει και για αρνητικούς ή κλασματικούς εκθέτες (όπου ορίζεται η δύναμη):</p>
$$\int \frac{1}{x^2}dx = \int x^{-2}dx = \frac{x^{-1}}{-1} = -\frac1x + c, \qquad \int \sqrt{x}\,dx = \int x^{1/2}dx = \frac{2}{3}x\sqrt{x} + c$$</div>

<div class="tbox"><h4>Ιδιότητες</h4>
$$\int \lambda f(x)\,dx = \lambda\int f(x)\,dx \qquad \int \big(f(x) \pm g(x)\big)dx = \int f(x)\,dx \pm \int g(x)\,dx$$
<p>Δηλαδή ολοκληρώνουμε <b>όρο προς όρο</b> και οι σταθερές «βγαίνουν έξω».</p></div>

<div class="tbox warn"><h4>⚠ Γινόμενο; Πρώτα πράξεις!</h4>
<p>Δεν υπάρχει κανόνας «ολοκλήρωμα γινομένου = γινόμενο ολοκληρωμάτων». Κάνε πρώτα τις πράξεις: $\int (x+2)(x-3)\,dx = \int (x^2 - x - 6)\,dx$.</p></div>

<div class="tbox tip"><h4>Πώς να γράφεις απαντήσεις εδώ</h4>
<p><code>x^3/3 - 2x</code> · <code>-1/x</code> · <code>2/3 x^(3/2)</code> ή <code>(2/3)x√x</code> · <code>6sqrt(x)</code>. Το <code>+c</code> είναι προαιρετικό.</p></div>`,
  widget: null,
  gen: "g23",
  exercises: [
    { level: 1, type: "anti", f: "4x^3-6x+5", q: R`$\displaystyle\int (4x^3 - 6x + 5)\,dx$`,
      hint: R`Όρο προς όρο: $\int 4x^3 = x^4$, ...`,
      sol: R`$= 4\cdot\frac{x^4}{4} - 6\cdot\frac{x^2}{2} + 5x + c = x^4 - 3x^2 + 5x + c$.` },
    { level: 2, type: "anti", f: "(x+2)(x-3)", q: R`$\displaystyle\int (x+2)(x-3)\,dx$`,
      hint: R`Πρώτα πολλαπλασιασμός: $(x+2)(x-3) = x^2 - x - 6$.`,
      sol: R`$\int (x^2 - x - 6)\,dx = \frac{x^3}{3} - \frac{x^2}{2} - 6x + c$.` },
    { level: 2, type: "anti", f: "(x^2-1)^2", q: R`$\displaystyle\int (x^2 - 1)^2\,dx$`,
      hint: R`Ανάπτυξε: $(x^2-1)^2 = x^4 - 2x^2 + 1$.`,
      sol: R`$\int (x^4 - 2x^2 + 1)\,dx = \frac{x^5}{5} - \frac{2x^3}{3} + x + c$.` },
    { level: 2, type: "anti", f: "1/x^2", pos: true, q: R`$\displaystyle\int \frac{1}{x^2}\,dx,\quad x > 0$`,
      hint: R`Γράψε $\frac{1}{x^2} = x^{-2}$ και εφάρμοσε τον κανόνα της δύναμης με $a = -2$.`,
      sol: R`$\int x^{-2}\,dx = \frac{x^{-1}}{-1} + c = -\frac{1}{x} + c$.` },
    { level: 2, type: "anti", f: "sqrt(x)", pos: true, q: R`$\displaystyle\int \sqrt{x}\,dx,\quad x > 0$`,
      hint: R`$\sqrt{x} = x^{1/2}$, νέος εκθέτης $\frac32$.`,
      sol: R`$\int x^{1/2}\,dx = \frac{x^{3/2}}{3/2} + c = \frac{2}{3}x^{3/2} + c = \frac23 x\sqrt{x} + c$.` },
    { level: 3, type: "anti", f: "3/sqrt(x)+2x", pos: true, q: R`$\displaystyle\int \left(\frac{3}{\sqrt{x}} + 2x\right)dx,\quad x > 0$`,
      hint: R`$\frac{3}{\sqrt x} = 3x^{-1/2}$. Νέος εκθέτης $\frac12$.`,
      sol: R`$\int 3x^{-1/2}\,dx = 3\cdot\frac{x^{1/2}}{1/2} = 6\sqrt{x}$. Άρα το ολοκλήρωμα είναι $6\sqrt{x} + x^2 + c$.` }
  ]
},

/* ───────────────────────────── 2.4 ───────────────────────────── */
{
  id: "2.4", unit: 2, title: "Εφαρμογές αόριστων ολοκληρωμάτων",
  book: "Α΄ Τεύχος §2.4 · Δραστηριότητες σελ. 77 · Ενότητας σελ. 78",
  theory: R`
<div class="tbox"><h4>Προβλήματα αρχικών τιμών</h4>
<p>Γνωρίζουμε την <b>παράγωγο</b> $f'(x)$ και μια <b>αρχική συνθήκη</b> (π.χ. ότι η γραφική περνά από ένα σημείο). Ζητάμε την ίδια την $f$.</p>
<ol><li>Ολοκληρώνω: $f(x) = \int f'(x)\,dx = F(x) + c$.</li>
<li>Βάζω τη συνθήκη για να βρω το $c$.</li></ol></div>

<div class="tbox"><h4>Παράδειγμα</h4>
<p>$f'(x) = 6x^2 - 2$ και $f(1) = 5$.<br>
$f(x) = 2x^3 - 2x + c$, $\;f(1) = 2 - 2 + c = 5 \Rightarrow c = 5$. Άρα $f(x) = 2x^3 - 2x + 5$.</p></div>

<div class="tbox tip"><h4>Λεξικό προβλημάτων</h4>
<ul><li>«Η <b>κλίση της καμπύλης</b> σε κάθε σημείο είναι ...» ⇒ δίνεται η $f'(x)$.</li>
<li>«Τοπικό ακρότατο στο $x_0$» ⇒ $f'(x_0) = 0$.</li>
<li><b>Οριακό κόστος</b> $K'(x)$ ⇒ ολοκληρώνω για το κόστος· τα <b>πάγια έξοδα</b> είναι το $K(0)$.</li>
<li><b>Ταχύτητα</b> $v(t) = s'(t)$ ⇒ ολοκληρώνω για τη θέση $s(t)$.</li>
<li>Αν δίνεται $f''$: ολοκληρώνω <b>δύο φορές</b> → δύο σταθερές, χρειάζομαι δύο συνθήκες.</li></ul></div>`,
  widget: "family2",
  exercises: [
    { level: 1, type: "ivp", f: "6x^2-2", x0: 1, y0: 5, q: R`Να βρείτε τη συνάρτηση $f$ με $f'(x) = 6x^2 - 2$ και $f(1) = 5$. Γράψτε την $f(x)$:`,
      hint: R`$f(x) = 2x^3 - 2x + c$. Βάλε $x = 1$.`,
      sol: R`$f(x) = 2x^3 - 2x + c$, $f(1) = c = 5$ ⇒ $f(x) = 2x^3 - 2x + 5$.` },
    { level: 1, type: "ivp", f: "2x+3", x0: 0, y0: -1, q: R`Η κλίση μιας καμπύλης σε κάθε σημείο της $(x, y)$ είναι $2x + 3$ και η καμπύλη διέρχεται από το $(0, -1)$. Να βρείτε την εξίσωσή της $y = f(x)$:`,
      hint: R`Κλίση = παράγωγος, άρα $f'(x) = 2x + 3$.`,
      sol: R`$f(x) = x^2 + 3x + c$, $f(0) = c = -1$ ⇒ $f(x) = x^2 + 3x - 1$.` },
    { level: 2, type: "expr", ref: "x^3-3x+2", q: R`Για μια συνάρτηση ισχύει $f''(x) = 6x$, $f'(0) = -3$ και $f(0) = 2$. Να βρείτε την $f(x)$:`,
      hint: R`Πρώτα $f'(x) = 3x^2 + c_1$ με $f'(0) = -3$. Μετά ολοκληρώνεις ξανά.`,

/* ================= Γεννήτριες εξάσκησης ================= */
function texPoly(cs) { // cs: [[coef, power], ...] → LaTeX
  let s = "";
  for (const [c, p] of cs) {
    if (c === 0) continue;
    const sign = c < 0 ? "-" : (s ? "+" : ""), a = Math.abs(c);
    const coef = (a === 1 && p !== 0) ? "" : (Number.isInteger(a) ? a : a.toString());
    const v = p === 0 ? "" : p === 1 ? "x" : `x^{${p}}`;
    s += ` ${sign} ${coef}${v}`;
  }
  return s.trim() || "0";
}
function plainPoly(cs) { return cs.filter(([c]) => c !== 0).map(([c, p]) => `${c >= 0 ? "+" : "-"}${Math.abs(c)}${p ? "*x^" + p : ""}`).join("") || "0"; }

function cubicGen() {
  // f'(x) = 3s(x−p)(x−q), p<q, p+q άρτιο ⇒ ακέραιοι συντελεστές
  let p, q; do { p = ri(-3, 2); q = ri(p + 1, 4); } while ((p + q) % 2);
  const s = Math.random() < 0.7 ? 1 : -1, d = ri(-4, 4);
  const c3 = s, c2 = -s * 3 * (p + q) / 2, c1 = s * 3 * p * q;
  const f = x => c3 * x ** 3 + c2 * x * x + c1 * x + d, m = (p + q) / 2;
  return { p, q, s, d, f, m, tex: texPoly([[c3, 3], [c2, 2], [c1, 1], [d, 0]]),
    maxX: s > 0 ? p : q, minX: s > 0 ? q : p };
}

const GENS = {
  g12: { title: "Γεννήτρια εξάσκησης — τοπικά ακρότατα", make() {
    const g = cubicGen();
    return { q: R`Να βρείτε τα τοπικά ακρότατα της $f(x) = ${g.tex}$.`,
      fields: [{ label: "τοπ. μέγιστο στο x =", ans: g.maxX }, { label: "τιμή =", ans: g.f(g.maxX) }, { label: "τοπ. ελάχιστο στο x =", ans: g.minX }, { label: "τιμή =", ans: g.f(g.minX) }],
      sol: R`$f'(x) = ${g.s > 0 ? "" : "-"}3(x ${g.p >= 0 ? "-" : "+"} ${Math.abs(g.p)})(x ${g.q >= 0 ? "-" : "+"} ${Math.abs(g.q)})$, ρίζες $${g.p}$ και $${g.q}$, πρόσημα $${g.s > 0 ? "+,\\,-,\\,+" : "-,\\,+,\\,-"}$.<br>Τοπικό μέγιστο $f(${g.maxX}) = ${g.f(g.maxX)}$, τοπικό ελάχιστο $f(${g.minX}) = ${g.f(g.minX)}$.`, graph: g.f };
  } },
  g14: { title: "Γεννήτρια — πλήρης μελέτη πολυωνυμικής", make() {
    const g = cubicGen();
    return { q: R`Να μελετήσετε τη συνάρτηση $f(x) = ${g.tex}$ και να συμπληρώσετε:`,
      fields: [{ label: "τομή με y: f(0) =", ans: g.d }, { label: "τοπ. μέγιστο στο x =", ans: g.maxX }, { label: "τοπ. μέγιστο: f =", ans: g.f(g.maxX) }, { label: "τοπ. ελάχιστο στο x =", ans: g.minX }, { label: "τοπ. ελάχιστο: f =", ans: g.f(g.minX) }, { label: "σημείο καμπής: x =", ans: g.m }, { label: "σημείο καμπής: f =", ans: g.f(g.m) }],
      sol: R`$f(0) = ${g.d}$. $f'(x) = ${g.s > 0 ? "" : "-"}3(x ${g.p >= 0 ? "-" : "+"} ${Math.abs(g.p)})(x ${g.q >= 0 ? "-" : "+"} ${Math.abs(g.q)})$ ⇒ τοπ. μέγιστο $(${g.maxX}, ${g.f(g.maxX)})$, τοπ. ελάχιστο $(${g.minX}, ${g.f(g.minX)})$.<br>$f''(x) = ${6 * g.s}x ${-3 * g.s * (g.p + g.q) >= 0 ? "+" : "-"} ${Math.abs(3 * g.s * (g.p + g.q))}$ = 0 στο $x = ${g.m}$ ⇒ σημείο καμπής $(${g.m}, ${g.f(g.m)})$ (πάντα στο μέσο των δύο κρίσιμων σημείων!).<br>Άκρα: $\lim_{x\to+\infty} f(x) = ${g.s > 0 ? "+" : "-"}\infty$, $\lim_{x\to-\infty} f(x) = ${g.s > 0 ? "-" : "+"}\infty$.`, graph: g.f };
  } },
  g23: { title: "Γεννήτρια — ολοκλήρωση πολυωνύμων", make() {
    const n = ri(2, 3), used = new Set(), terms = [];
    while (terms.length < n) { const p = ri(0, 4); if (used.has(p)) continue; used.add(p); const k = ri(1, 4) * (Math.random() < 0.3 ? -1 : 1); terms.push([k * (p + 1), p]); }
    terms.sort((a, b) => b[1] - a[1]);
    const anti = terms.map(([c, p]) => [c / (p + 1), p + 1]);
    return { q: R`$\displaystyle\int \left(${texPoly(terms)}\right)dx$`, type: "anti", f: plainPoly(terms),
      sol: R`Όρο προς όρο, με $\int x^a dx = \frac{x^{a+1}}{a+1}$: $\;${texPoly(anti)} + c$.` };
  } }
};

<script>
/* ================= Parser: μαθηματική έκφραση → συνάρτηση του x ================= */
const MathParse = (() => {
  function normalize(s) {
    return String(s)
      .replace(/[−–—]/g, "-").replace(/[·×∙⋅]/g, "*").replace(/÷/g, "/")
      .replace(/√/g, "sqrt").replace(/π/g, "pi")
      .replace(/²/g, "^2").replace(/³/g, "^3").replace(/⁴/g, "^4").replace(/⁵/g, "^5")
      .replace(/(\d),(\d)/g, "$1.$2")
      .replace(/^\s*(y|f\s*\(\s*x\s*\)|F\s*\(\s*x\s*\))\s*=\s*/i, "")
      .replace(/\s+/g, "");
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/[0-9.]/.test(ch)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: "n", v: parseFloat(s.slice(i, j)) }); i = j; }
      else if (/[a-zA-Z]/.test(ch)) {
        let j = i; while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;

  main.appendChild(exs);
  if (s.gen) {
    const G = GENS[s.gen], gs = h("section", { class: "card gen" }, `<h3 class="blk">♾️ ${G.title}</h3><p class="muted small">Κάθε φορά καινούργια άσκηση — εξάσκηση χωρίς τέλος.</p><div class="gslot"></div><button class="btn primary newg">Νέα άσκηση ↻</button>`);
    main.appendChild(gs);
    let count = 0;
    const fresh = () => { count++; const slot = $(".gslot", gs); slot.innerHTML = ""; const ex = G.make(); slot.appendChild(exerciseCard(ex, { title: `Εξάσκηση #${count}` })); typeset(slot); };
    $(".newg", gs).onclick = fresh; fresh();
  }
  const nav = h("div", { class: "pager" });
  if (idx > 0) nav.appendChild(h("button", { class: "btn ghost", onclick: () => go(SECTIONS[idx - 1].id) }, `← ${SECTIONS[idx - 1].id} ${SECTIONS[idx - 1].title}`)); else nav.appendChild(h("span"));
  if (idx < SECTIONS.length - 1) nav.appendChild(h("button", { class: "btn primary", onclick: () => go(SECTIONS[idx + 1].id) }, `${SECTIONS[idx + 1].id} ${SECTIONS[idx + 1].title} →`));
  main.appendChild(nav);
}

function boot() {
  let start = "home";
  try { const hsh = decodeURIComponent(location.hash.slice(1)); if (hsh && (hsh === "home" || SECTIONS.some(s => s.id === hsh))) start = hsh; } catch (e) {}
  go(start, false);
}
if (window.renderMathInElement) boot(); else window.addEventListener("load", boot);

</script>
</body>
</html>
